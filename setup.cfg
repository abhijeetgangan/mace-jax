[metadata]
name = mace_jax
version = attr: mace_jax.__version__
long_description = file: README.md
long_description_content_type = text/markdown
classifiers =
    Programming Language :: Python :: 3.11

[options]
packages = find:
python_requires = >=3.11
install_requires =
    ase
    flax
    optax
    cuequivariance-jax==0.4.0
    cuequivariance-ops-jax-cu12==0.4.0
    packaging
    nvidia-cuda-nvrtc-cu12
    matscipy